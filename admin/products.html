<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produits — VEINTUNO HOUSE Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-shell" id="adminShell">
  <main class="admin-main">
    <div class="admin-header">
      <div>
        <h1>Produits</h1>
        <p>Gérez le catalogue : prix, stock, visuels, statuts, éligibilité aux packs.</p>
      </div>
      <div class="admin-header__actions">
        <button type="button" class="admin-btn admin-btn--gold" id="newProductBtn">+ Nouveau produit</button>
      </div>
    </div>

    <div class="admin-toolbar">
      <input type="search" id="searchInput" placeholder="Rechercher un produit...">
      <select id="collectionFilter"><option value="">Toutes les collections</option></select>
      <select id="statusFilter">
        <option value="">Tous les statuts</option>
        <option value="active">Actif</option>
        <option value="inactive">Inactif</option>
      </select>
      <select id="flashSaleFilter">
        <option value="">Flash Sale : tous</option>
        <option value="on">Flash Sale actif</option>
      </select>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th></th><th>Produit</th><th>Collection</th><th>Prix</th><th>Stock</th><th>Statut</th><th>Tags</th><th></th>
          </tr>
        </thead>
        <tbody id="productsBody"></tbody>
      </table>
      <div class="admin-table__empty" id="emptyState" style="display:none;">Aucun produit.</div>
    </div>
  </main>
</div>

<script src="js/admin-shared.js"></script>
<script>
let allProducts = [];
let collections = [];
let characteristics = [];

function productRowHTML(p) {
  const col = collections.find((c) => c.id === p.collectionId);
  const tags = [];
  if (p.isBestSeller) tags.push('<span class="badge badge--gold">Best Seller</span>');
  if (p.isNew) tags.push('<span class="badge badge--gray">New</span>');
  if (p.isLimitedEdition) tags.push('<span class="badge badge--black">Édition limitée</span>');
  if (p.flashSaleActive) tags.push('<span class="badge badge--red">Flash Sale</span>');
  let images = [];
  try { images = JSON.parse(p.images || '[]'); } catch (e) {}

  return `
    <tr data-id="${p.id}">
      <td><div class="thumb-preview">${images[0] ? `<img src="${images[0]}" style="width:100%;height:100%;object-fit:cover;">` : svgFor(p.shape, p.color)}</div></td>
      <td><strong>${p.name}</strong><div style="color:var(--gray);font-size:12px;">${p.notes || ''}</div></td>
      <td>${col ? col.name : '—'}</td>
      <td>${p.flashSaleActive && p.flashSalePrice != null ? `<span style="text-decoration:line-through;color:var(--gray);font-size:12px;">${p.price} MAD</span> <strong style="color:#a13333;">${p.flashSalePrice} MAD</strong>` : `${p.price} MAD`}</td>
      <td>${p.stock}</td>
      <td>${p.isActive ? '<span class="badge badge--green">Actif</span>' : '<span class="badge badge--gray">Inactif</span>'}</td>
      <td>${tags.join(' ')}</td>
      <td class="row-actions">
        <button data-action="edit">Modifier</button>
        <button data-action="duplicate">Dupliquer</button>
        <button data-action="delete" class="is-danger">Supprimer</button>
      </td>
    </tr>`;
}

function toLocalDateTimeInput(iso) {
  const d = new Date(iso);
  const pad = (n) => n.toString().padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function svgFor(shape, color) {
  if (shape === 'jar') return `<svg viewBox="0 0 120 220"><rect x="26" y="60" width="68" height="100" fill="${color}"/></svg>`;
  if (shape === 'tube') return `<svg viewBox="0 0 120 220"><path d="M40 60 l12 128 h16 L80 60Z" fill="${color}"/></svg>`;
  return `<svg viewBox="0 0 120 220"><rect x="34" y="90" width="52" height="80" fill="${color}"/></svg>`;
}

function renderTable() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const colFilter = document.getElementById('collectionFilter').value;
  const statusFilter = document.getElementById('statusFilter').value;
  const flashFilter = document.getElementById('flashSaleFilter').value;
  const filtered = allProducts.filter((p) => {
    const matchSearch = !search || p.name.toLowerCase().includes(search);
    const matchCol = !colFilter || p.collectionId === colFilter;
    const matchStatus = !statusFilter || (statusFilter === 'active' ? p.isActive : !p.isActive);
    const matchFlash = !flashFilter || p.flashSaleActive;
    return matchSearch && matchCol && matchStatus && matchFlash;
  });
  document.getElementById('productsBody').innerHTML = filtered.map(productRowHTML).join('');
  document.getElementById('emptyState').style.display = filtered.length ? 'none' : 'block';
}

async function loadAll() {
  [allProducts, collections, characteristics] = await Promise.all([adminApi('/products'), adminApi('/collections'), adminApi('/characteristics')]);
  const filterSelect = document.getElementById('collectionFilter');
  filterSelect.innerHTML = '<option value="">Toutes les collections</option>' +
    collections.map((c) => `<option value="${c.id}">${c.name}</option>`).join('');
  renderTable();
}

document.getElementById('searchInput').addEventListener('input', renderTable);
document.getElementById('collectionFilter').addEventListener('change', renderTable);
document.getElementById('statusFilter').addEventListener('change', renderTable);
document.getElementById('flashSaleFilter').addEventListener('change', renderTable);

document.getElementById('productsBody').addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const id = btn.closest('tr').dataset.id;
  const product = allProducts.find((p) => p.id === id);

  if (btn.dataset.action === 'edit') openProductModal(product);
  if (btn.dataset.action === 'duplicate') {
    await adminApi(`/products/${id}/duplicate`, { method: 'POST' });
    toast('Produit dupliqué.');
    await loadAll();
  }
  if (btn.dataset.action === 'delete') {
    const ok = await confirmDialog(`Supprimer "${product.name}" ? Cette action est irréversible.`);
    if (!ok) return;
    try {
      await adminApi(`/products/${id}`, { method: 'DELETE' });
      toast('Produit supprimé.');
      await loadAll();
    } catch (err) { toast(err.message, 'error'); }
  }
});

document.getElementById('newProductBtn').addEventListener('click', () => openProductModal(null));

function openProductModal(product) {
  const isEdit = !!product;
  let images = [];
  if (isEdit) { try { images = JSON.parse(product.images || '[]'); } catch (e) {} }

  const overlay = document.createElement('div');
  overlay.className = 'admin-modal-overlay';
  overlay.innerHTML = `
    <div class="admin-modal admin-modal--wide">
      <div class="admin-modal__header">
        <h2>${isEdit ? 'Modifier le produit' : 'Nouveau produit'}</h2>
        <button class="admin-modal__close" data-close>&times;</button>
      </div>
      <form class="admin-form" id="productForm">
        <div class="admin-form__row">
          <div class="admin-field"><label>Nom</label><input name="name" required value="${isEdit ? product.name : ''}"></div>
          <div class="admin-field"><label>Collection</label>
            <select name="collectionId" required>${collections.map((c) => `<option value="${c.id}" ${isEdit && product.collectionId === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}</select>
          </div>
        </div>
        <div class="admin-form__row">
          <div class="admin-field"><label>Prix (MAD)</label><input type="number" step="0.01" name="price" required value="${isEdit ? product.price : ''}"></div>
          <div class="admin-field"><label>Stock</label><input type="number" name="stock" value="${isEdit ? product.stock : 50}"></div>
        </div>
        <div class="admin-form__row">
          <div class="admin-field"><label>Prix de revient / coût (MAD, optionnel)</label><input type="number" step="0.01" name="costPrice" value="${isEdit && product.costPrice != null ? product.costPrice : ''}" placeholder="ex. 25"></div>
          <div class="admin-field"><p class="admin-field-help" style="margin-top:24px;">Utilisé uniquement pour calculer le Profit d'une commande une fois livrée — jamais affiché au client.</p></div>
        </div>
        <div class="admin-form__row">
          <div class="admin-field"><label>Notes / courte description (carte produit)</label><input name="notes" value="${isEdit ? (product.notes || '') : ''}" placeholder="ex. Boisé / Ambré"></div>
          <div class="admin-field"><label>Contenance</label><input name="volume" value="${isEdit ? (product.volume || '') : ''}" placeholder="ex. 50ML"></div>
        </div>
        <div class="admin-field">
          <label>Genre / catégorie (parfums) — un produit peut appartenir à plusieurs</label>
          <div class="admin-checkbox-grid">
            <label class="admin-checkbox"><input type="checkbox" name="genders" value="homme" ${isEdit && product.genders && product.genders.includes('homme') ? 'checked' : ''}> Homme</label>
            <label class="admin-checkbox"><input type="checkbox" name="genders" value="femme" ${isEdit && product.genders && product.genders.includes('femme') ? 'checked' : ''}> Femme</label>
            <label class="admin-checkbox"><input type="checkbox" name="genders" value="unisexe" ${isEdit && product.genders && product.genders.includes('unisexe') ? 'checked' : ''}> Unisexe</label>
          </div>
        </div>
        <div class="admin-field" id="productFilterOptionsField"></div>
        <div class="admin-field">
          <label>Caractéristiques olfactives (recherche intelligente + quiz "Find Your Scent")</label>
          <div class="admin-checkbox-grid">
            ${characteristics.length ? characteristics.map((c) => `<label class="admin-checkbox"><input type="checkbox" name="characteristicIds" value="${c.id}" ${isEdit && (product.characteristicIds || []).includes(c.id) ? 'checked' : ''}> ${c.name}</label>`).join('') : '<p class="admin-field-help">Aucune caractéristique définie — gérez-les dans Réglages → Caractéristiques.</p>'}
          </div>
        </div>
        <div class="admin-field"><label>Description longue</label><textarea name="description">${isEdit ? (product.description || '') : ''}</textarea></div>
        <div class="admin-field">
          <label>Notes olfactives (page produit)</label>
          <div class="admin-form__row" style="margin-bottom:10px;">
            <input name="notesTop" placeholder="Notes de tête (ex. Bergamote, citron)" value="${isEdit ? (product.notesTop || '') : ''}">
            <input name="notesHeart" placeholder="Notes de cœur (ex. Jasmin, lavande)" value="${isEdit ? (product.notesHeart || '') : ''}">
          </div>
          <input name="notesBase" placeholder="Notes de fond (ex. Ambre, bois)" value="${isEdit ? (product.notesBase || '') : ''}">
        </div>
        <div class="admin-field" style="border-top:1px solid var(--border);padding-top:14px;">
          <label>Pyramide olfactive (optionnel)</label>
          <p class="admin-field-help" style="margin-bottom:14px;">Chaque note peut avoir sa propre image. Si cette section est vide, la page produit utilise le texte simple ci-dessus.</p>
          ${['Top', 'Heart', 'Base'].map((key) => `
            <div class="note-pyramid-block" style="margin-bottom:18px;">
              <p style="font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--gray);margin-bottom:8px;">${{ Top: 'Notes de tête', Heart: 'Notes de cœur', Base: 'Notes de fond' }[key]}</p>
              <div class="note-card-grid" id="notes${key}Grid" style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px;"></div>
              <button type="button" class="admin-btn admin-btn--small admin-btn--ghost" data-add-note="${key}">+ Ajouter une note</button>
            </div>`).join('')}
        </div>
        <div class="admin-field"><label>Ingrédients (optionnel)</label><textarea name="ingredients">${isEdit ? (product.ingredients || '') : ''}</textarea></div>
        <div class="admin-field"><label>Conseils d'utilisation (optionnel)</label><textarea name="usage">${isEdit ? (product.usage || '') : ''}</textarea></div>
        <div class="admin-field"><label>Livraison spécifique à ce produit (optionnel)</label><textarea name="deliveryInfo">${isEdit ? (product.deliveryInfo || '') : ''}</textarea><p class="admin-field-help">Vide = l'information de livraison générale s'affiche.</p></div>
        <div class="admin-field"><label>Pourquoi vous allez l'aimer (une affirmation par ligne, optionnel)</label><textarea name="benefits">${isEdit ? (() => { try { return JSON.parse(product.benefits || '[]').join('\n'); } catch (e) { return ''; } })() : ''}</textarea><p class="admin-field-help">N'écrivez que des affirmations vraies pour ce produit.</p></div>
        <div class="admin-form__row">
          <div class="admin-field"><label>Forme du visuel</label>
            <select name="shape">
              <option value="bottle" ${isEdit && product.shape === 'bottle' ? 'selected' : ''}>Flacon</option>
              <option value="jar" ${isEdit && product.shape === 'jar' ? 'selected' : ''}>Pot</option>
              <option value="tube" ${isEdit && product.shape === 'tube' ? 'selected' : ''}>Tube</option>
            </select>
          </div>
          <div class="admin-field"><label>Couleur</label><input type="color" name="color" value="${isEdit ? product.color : '#0c0c0c'}"></div>
        </div>
        <div class="admin-field">
          <label>Images</label>
          <div id="imageList" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;"></div>
          <input type="file" id="imageUpload" accept="image/*">
          <p class="admin-field-help">La première image est utilisée comme visuel principal.</p>
        </div>
        <div class="admin-field"><label>Vidéo (URL, optionnel)</label><input name="videoUrl" value="${isEdit ? (product.videoUrl || '') : ''}"></div>

        <div class="admin-field" style="background:#fdf3f3;border:1px solid #f0d5d5;border-radius:8px;padding:16px;">
          <label class="admin-checkbox" style="margin-bottom:10px;"><input type="checkbox" name="flashSaleActive" id="flashSaleActiveCheck" ${isEdit && product.flashSaleActive ? 'checked' : ''}> <strong>Flash Sale actif</strong></label>
          <div id="flashSaleFields" style="display:${isEdit && product.flashSaleActive ? 'block' : 'none'};">
            <div class="admin-form__row">
              <div class="admin-field"><label>Prix Flash Sale (MAD)</label><input type="number" step="0.01" name="flashSalePrice" value="${isEdit && product.flashSalePrice != null ? product.flashSalePrice : ''}"></div>
              <div class="admin-field"><label>Étiquette (optionnel)</label><input name="flashSaleLabel" value="${isEdit && product.flashSaleLabel ? product.flashSaleLabel : ''}" placeholder="ex. OFFRE LIMITÉE"></div>
            </div>
            <div class="admin-form__row">
              <div class="admin-field"><label>Début (optionnel)</label><input type="datetime-local" name="flashSaleStart" value="${isEdit && product.flashSaleStart ? toLocalDateTimeInput(product.flashSaleStart) : ''}"></div>
              <div class="admin-field"><label>Fin (optionnel — active un compte à rebours)</label><input type="datetime-local" name="flashSaleEnd" value="${isEdit && product.flashSaleEnd ? toLocalDateTimeInput(product.flashSaleEnd) : ''}"></div>
            </div>
            <div class="admin-field">
              <label>Campagne (optionnel — synchronise le compte à rebours avec d'autres produits)</label>
              <select name="campaignId" id="campaignSelect"><option value="">— Aucune, dates ci-dessus —</option></select>
            </div>
            <p class="admin-field-help">Le prix normal n'est jamais modifié — la promotion s'applique automatiquement pendant la période définie (ou en permanence si aucune date n'est fixée).</p>
          </div>
        </div>

        <div class="admin-field">
          <label>Statuts</label>
          <div class="admin-checkbox-grid">
            <label class="admin-checkbox"><input type="checkbox" name="isActive" ${!isEdit || product.isActive ? 'checked' : ''}> Actif (visible sur le site)</label>
            <label class="admin-checkbox"><input type="checkbox" name="isNew" ${isEdit && product.isNew ? 'checked' : ''}> New</label>
            <label class="admin-checkbox"><input type="checkbox" name="isBestSeller" ${isEdit && product.isBestSeller ? 'checked' : ''}> Best Seller</label>
            <label class="admin-checkbox"><input type="checkbox" name="isLimitedEdition" ${isEdit && product.isLimitedEdition ? 'checked' : ''}> Édition limitée</label>
            <label class="admin-checkbox"><input type="checkbox" name="packEligible" ${!isEdit || product.packEligible ? 'checked' : ''}> Éligible aux packs classiques</label>
            <label class="admin-checkbox"><input type="checkbox" name="freePackEligible" ${isEdit && product.freePackEligible ? 'checked' : ''}> Éligible au Free Pack</label>
          </div>
        </div>
        <div class="admin-modal__actions">
          <button type="button" class="admin-btn admin-btn--ghost" data-close>Annuler</button>
          <button type="submit" class="admin-btn admin-btn--gold">${isEdit ? 'Enregistrer' : 'Créer'}</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(overlay);

  const selectedFilterOptionIds = new Set(isEdit ? (product.filterOptionIds || []) : []);
  function renderProductFilterOptions() {
    const collectionId = overlay.querySelector('[name="collectionId"]').value;
    const col = collections.find((c) => c.id === collectionId);
    const options = (col && col.filterOptions) || [];
    const field = document.getElementById('productFilterOptionsField');
    if (!options.length) { field.innerHTML = ''; return; }
    field.innerHTML = `
      <label>Filtre de "${col.name}" — à quelle(s) option(s) ce produit appartient-il ?</label>
      <div class="admin-checkbox-grid">
        ${options.map((o) => `<label class="admin-checkbox"><input type="checkbox" name="filterOptionIds" value="${o.id}" ${selectedFilterOptionIds.has(o.id) ? 'checked' : ''}> ${o.label}</label>`).join('')}
      </div>`;
  }
  renderProductFilterOptions();
  overlay.querySelector('[name="collectionId"]').addEventListener('change', renderProductFilterOptions);

  const noteLabels = { Top: 'Notes de tête', Heart: 'Notes de cœur', Base: 'Notes de fond' };
  const noteState = {
    Top: isEdit && Array.isArray(product.notesTopData) ? product.notesTopData.map((n) => ({ ...n })) : [],
    Heart: isEdit && Array.isArray(product.notesHeartData) ? product.notesHeartData.map((n) => ({ ...n })) : [],
    Base: isEdit && Array.isArray(product.notesBaseData) ? product.notesBaseData.map((n) => ({ ...n })) : [],
  };

  function renderNoteGrid(key) {
    const grid = document.getElementById(`notes${key}Grid`);
    if (!grid) return;
    const list = noteState[key];
    grid.innerHTML = list.map((note, i) => `
      <div class="note-card" style="width:120px;border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center;">
        <div style="width:100%;aspect-ratio:1/1;border-radius:50%;overflow:hidden;background:var(--bg-muted,#f3f1ec);display:flex;align-items:center;justify-content:center;margin-bottom:6px;">
          ${note.image ? `<img src="${note.image}" style="width:100%;height:100%;object-fit:cover;">` : '<span style="color:var(--gray);font-size:11px;">Pas d\'image</span>'}
        </div>
        <input value="${note.name || ''}" placeholder="Nom" data-note-name="${key}:${i}" style="width:100%;font-size:12px;text-align:center;margin-bottom:6px;padding:4px;">
        <label class="admin-btn admin-btn--small admin-btn--ghost" style="display:block;margin-bottom:4px;cursor:pointer;">
          ${note.image ? 'Remplacer' : 'Ajouter image'}
          <input type="file" accept="image/jpeg,image/jpg,image/png,image/webp" data-note-upload="${key}:${i}" hidden>
        </label>
        <div style="display:flex;justify-content:space-between;gap:4px;">
          <button type="button" data-note-move="${key}:${i}:-1" ${i === 0 ? 'disabled' : ''} style="flex:1;font-size:11px;">◀</button>
          <button type="button" data-note-remove="${key}:${i}" style="flex:1;font-size:11px;color:#b23b3b;">Suppr.</button>
          <button type="button" data-note-move="${key}:${i}:1" ${i === list.length - 1 ? 'disabled' : ''} style="flex:1;font-size:11px;">▶</button>
        </div>
      </div>`).join('') || '<p class="admin-field-help">Aucune note ajoutée ici.</p>';
  }
  ['Top', 'Heart', 'Base'].forEach(renderNoteGrid);

  overlay.querySelectorAll('[data-add-note]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.addNote;
      noteState[key].push({ name: '', image: null });
      renderNoteGrid(key);
    });
  });
  overlay.addEventListener('input', (e) => {
    const input = e.target.closest('[data-note-name]');
    if (!input) return;
    const [key, idx] = input.dataset.noteName.split(':');
    noteState[key][Number(idx)].name = input.value;
  });
  overlay.addEventListener('click', (e) => {
    const moveBtn = e.target.closest('[data-note-move]');
    if (moveBtn) {
      const [key, idxStr, dirStr] = moveBtn.dataset.noteMove.split(':');
      const i = Number(idxStr); const j = i + Number(dirStr);
      if (j < 0 || j >= noteState[key].length) return;
      const list = noteState[key];
      [list[i], list[j]] = [list[j], list[i]];
      renderNoteGrid(key);
      return;
    }
    const removeBtn = e.target.closest('[data-note-remove]');
    if (removeBtn) {
      const [key, idx] = removeBtn.dataset.noteRemove.split(':');
      noteState[key].splice(Number(idx), 1);
      renderNoteGrid(key);
    }
  });
  overlay.addEventListener('change', async (e) => {
    const uploadInput = e.target.closest('[data-note-upload]');
    if (!uploadInput) return;
    const file = uploadInput.files[0];
    if (!file) return;
    if (file.size > 8 * 1024 * 1024) { toast('Image trop lourde (8 Mo maximum).', 'error'); uploadInput.value = ''; return; }
    const [key, idx] = uploadInput.dataset.noteUpload.split(':');
    const fd = new FormData(); fd.append('file', file);
    try {
      const result = await adminApi('/upload', { method: 'POST', body: fd });
      noteState[key][Number(idx)].image = result.url;
      renderNoteGrid(key);
    } catch (err) { toast(err.message, 'error'); }
  });

  function renderImages() {
    document.getElementById('imageList').innerHTML = images.map((url, i) => `
      <div style="width:86px;">
        <div style="position:relative;">
          <img src="${url}" style="width:86px;height:86px;object-fit:cover;border-radius:6px;${i === 0 ? 'outline:2px solid #D4AF37;outline-offset:1px;' : ''}">
          <button type="button" data-remove-img="${i}" style="position:absolute;top:-6px;right:-6px;background:#000;color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;">&times;</button>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:12px;">
          <button type="button" data-move="${i}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="Avancer" style="cursor:pointer;">&#9664;</button>
          <button type="button" data-primary="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Image principale" title="Image principale" style="cursor:pointer;">&#9733;</button>
          <button type="button" data-move="${i}" data-dir="1" ${i === images.length - 1 ? 'disabled' : ''} aria-label="Reculer" style="cursor:pointer;">&#9654;</button>
        </div>
      </div>`).join('');
    const list = document.getElementById('imageList');
    list.querySelectorAll('[data-remove-img]').forEach((btn) => {
      btn.addEventListener('click', () => { images.splice(Number(btn.dataset.removeImg), 1); renderImages(); });
    });
    list.querySelectorAll('[data-move]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const i = Number(btn.dataset.move);
        const j = i + Number(btn.dataset.dir);
        if (j < 0 || j >= images.length) return;
        [images[i], images[j]] = [images[j], images[i]];
        renderImages();
      });
    });
    list.querySelectorAll('[data-primary]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const i = Number(btn.dataset.primary);
        const [picked] = images.splice(i, 1);
        images.unshift(picked);
        renderImages();
      });
    });
  }
  renderImages();

  document.getElementById('imageUpload').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('file', file);
    try {
      const result = await adminApi('/upload', { method: 'POST', body: fd });
      images.push(result.url);
      renderImages();
    } catch (err) { toast(err.message, 'error'); }
    e.target.value = '';
  });

  overlay.querySelectorAll('[data-close]').forEach((el) => el.addEventListener('click', () => overlay.remove()));
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  document.getElementById('flashSaleActiveCheck').addEventListener('change', (e) => {
    document.getElementById('flashSaleFields').style.display = e.target.checked ? 'block' : 'none';
  });

  adminApi('/campaigns').then((campaigns) => {
    const select = document.getElementById('campaignSelect');
    for (const c of campaigns) {
      const opt = document.createElement('option');
      opt.value = c.id; opt.textContent = c.name;
      if (isEdit && product.campaignId === c.id) opt.selected = true;
      select.appendChild(opt);
    }
  }).catch(() => {});

  document.getElementById('productForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = {
      name: fd.get('name'), collectionId: fd.get('collectionId'),
      price: fd.get('price'), costPrice: fd.get('costPrice') || null, stock: fd.get('stock'),
      notes: fd.get('notes'), description: fd.get('description'),
      genders: fd.getAll('genders'), characteristicIds: fd.getAll('characteristicIds'), filterOptionIds: fd.getAll('filterOptionIds'), volume: fd.get('volume'), notesTop: fd.get('notesTop'), notesHeart: fd.get('notesHeart'), notesBase: fd.get('notesBase'),
      notesTopData: noteState.Top, notesHeartData: noteState.Heart, notesBaseData: noteState.Base,
      ingredients: fd.get('ingredients'), usage: fd.get('usage'), deliveryInfo: fd.get('deliveryInfo'),
      benefits: String(fd.get('benefits') || '').split('\n').map((x) => x.trim()).filter(Boolean),
      shape: fd.get('shape'), color: fd.get('color'), videoUrl: fd.get('videoUrl'),
      images,
      isActive: fd.get('isActive') === 'on', isNew: fd.get('isNew') === 'on',
      isBestSeller: fd.get('isBestSeller') === 'on', isLimitedEdition: fd.get('isLimitedEdition') === 'on',
      packEligible: fd.get('packEligible') === 'on', freePackEligible: fd.get('freePackEligible') === 'on',
      flashSaleActive: fd.get('flashSaleActive') === 'on',
      flashSalePrice: fd.get('flashSalePrice') || null,
      flashSaleLabel: fd.get('flashSaleLabel') || null,
      flashSaleStart: fd.get('flashSaleStart') || null,
      flashSaleEnd: fd.get('flashSaleEnd') || null,
      campaignId: fd.get('campaignId') || null,
    };
    try {
      if (isEdit) await adminApi(`/products/${product.id}`, { method: 'PUT', body: JSON.stringify(payload) });
      else await adminApi('/products', { method: 'POST', body: JSON.stringify(payload) });
      toast(isEdit ? 'Produit mis à jour.' : 'Produit créé.');
      overlay.remove();
      await loadAll();
    } catch (err) { toast(err.message, 'error'); }
  });
}

(async () => {
  const admin = await initAdminPage('products.html');
  if (!admin) return;
  await loadAll();
})();
</script>
</body>
</html>
