<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codes promo — VEINTUNO HOUSE Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-shell" id="adminShell">
  <main class="admin-main">
    <div class="admin-header">
      <div><h1>Codes promo</h1><p>Réductions en % ou fixes, avec conditions d'éligibilité.</p></div>
      <div class="admin-header__actions"><button type="button" class="admin-btn admin-btn--gold" id="newPromoBtn">+ Nouveau code</button></div>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>Code</th><th>Réduction</th><th>Conditions</th><th>Utilisations</th><th>Expiration</th><th>Statut</th><th></th></tr></thead>
        <tbody id="promosBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="js/admin-shared.js"></script>
<script>
let promos = [], collections = [], products = [], packs = [];

function rowHTML(p) {
  const parts = [];
  if (p.minOrderAmount) parts.push(`Min. ${p.minOrderAmount} MAD`);
  if (p.eligibleProducts.length) parts.push(`${p.eligibleProducts.length} produit(s)`);
  if (p.eligiblePacks.length) parts.push(`${p.eligiblePacks.length} pack(s)`);
  if (p.eligibleCollections.length) parts.push(`${p.eligibleCollections.length} collection(s)`);
  const now = new Date();
  const expired = p.expiresAt && new Date(p.expiresAt) < now;
  return `
    <tr data-id="${p.id}">
      <td><strong>${p.code}</strong></td>
      <td>${p.type === 'PERCENT' ? `${p.value}%` : `${p.value} MAD`}</td>
      <td style="color:var(--gray);font-size:12px;">${parts.length ? parts.join(' · ') : 'Toute la commande'}</td>
      <td>${p.usageCount}${p.usageLimit ? ` / ${p.usageLimit}` : ''}</td>
      <td>${p.expiresAt ? formatDate(p.expiresAt) : '—'}</td>
      <td>${expired ? '<span class="badge badge--red">Expiré</span>' : p.isActive ? '<span class="badge badge--green">Actif</span>' : '<span class="badge badge--gray">Inactif</span>'}</td>
      <td class="row-actions">
        <button data-action="edit">Modifier</button>
        <button data-action="toggle">${p.isActive ? 'Désactiver' : 'Activer'}</button>
        <button data-action="delete" class="is-danger">Supprimer</button>
      </td>
    </tr>`;
}

async function loadAll() {
  [promos, collections, products, packs] = await Promise.all([
    adminApi('/promo-codes'), adminApi('/collections'), adminApi('/products'), adminApi('/packs'),
  ]);
  document.getElementById('promosBody').innerHTML = promos.map(rowHTML).join('');
}

document.getElementById('promosBody').addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const id = btn.closest('tr').dataset.id;
  const promo = promos.find((p) => p.id === id);
  if (btn.dataset.action === 'edit') openModal(promo);
  if (btn.dataset.action === 'toggle') { await adminApi(`/promo-codes/${id}`, { method: 'PUT', body: JSON.stringify({ isActive: !promo.isActive }) }); toast('Statut mis à jour.'); await loadAll(); }
  if (btn.dataset.action === 'delete') {
    const ok = await confirmDialog(`Supprimer le code "${promo.code}" ?`);
    if (!ok) return;
    await adminApi(`/promo-codes/${id}`, { method: 'DELETE' }); toast('Code supprimé.'); await loadAll();
  }
});

document.getElementById('newPromoBtn').addEventListener('click', () => openModal(null));

function openModal(promo) {
  const isEdit = !!promo;
  const overlay = document.createElement('div');
  overlay.className = 'admin-modal-overlay';
  overlay.innerHTML = `
    <div class="admin-modal admin-modal--wide">
      <div class="admin-modal__header"><h2>${isEdit ? 'Modifier le code' : 'Nouveau code promo'}</h2><button class="admin-modal__close" data-close>&times;</button></div>
      <form class="admin-form" id="promoForm">
        <div class="admin-form__row">
          <div class="admin-field"><label>Code</label><input name="code" required style="text-transform:uppercase;" value="${isEdit ? promo.code : ''}"></div>
          <div class="admin-field"><label>Type</label>
            <select name="type"><option value="PERCENT" ${isEdit && promo.type === 'PERCENT' ? 'selected' : ''}>Pourcentage</option><option value="FIXED" ${isEdit && promo.type === 'FIXED' ? 'selected' : ''}>Montant fixe</option></select>
          </div>
        </div>
        <div class="admin-form__row">
          <div class="admin-field"><label>Valeur</label><input type="number" step="0.01" name="value" required value="${isEdit ? promo.value : ''}"></div>
          <div class="admin-field"><label>Montant minimum de commande (optionnel)</label><input type="number" step="0.01" name="minOrderAmount" value="${isEdit && promo.minOrderAmount != null ? promo.minOrderAmount : ''}"></div>
        </div>
        <div class="admin-form__row">
          <div class="admin-field"><label>Date d'expiration (optionnel)</label><input type="date" name="expiresAt" value="${isEdit && promo.expiresAt ? promo.expiresAt.slice(0, 10) : ''}"></div>
          <div class="admin-field"><label>Limite d'utilisation (optionnel)</label><input type="number" name="usageLimit" value="${isEdit && promo.usageLimit != null ? promo.usageLimit : ''}"></div>
        </div>
        <label class="admin-checkbox"><input type="checkbox" name="isActive" ${!isEdit || promo.isActive ? 'checked' : ''}> Actif</label>
        <p class="admin-field-help">Laissez les 3 listes ci-dessous vides pour un code applicable à toute la commande.</p>
        <div class="admin-field"><label>Collections éligibles</label><div class="admin-checkbox-grid" id="promoCollections">${collections.map((c) => `<label class="admin-checkbox"><input type="checkbox" value="${c.id}" ${isEdit && promo.eligibleCollections.some((r) => r.collectionId === c.id) ? 'checked' : ''}> ${c.name}</label>`).join('')}</div></div>
        <div class="admin-field"><label>Packs éligibles</label><div class="admin-checkbox-grid" id="promoPacks">${packs.map((p) => `<label class="admin-checkbox"><input type="checkbox" value="${p.id}" ${isEdit && promo.eligiblePacks.some((r) => r.packId === p.id) ? 'checked' : ''}> ${p.name}</label>`).join('')}</div></div>
        <div class="admin-field"><label>Produits éligibles</label><div class="admin-checkbox-grid" id="promoProducts" style="max-height:180px;overflow-y:auto;">${products.map((p) => `<label class="admin-checkbox"><input type="checkbox" value="${p.id}" ${isEdit && promo.eligibleProducts.some((r) => r.productId === p.id) ? 'checked' : ''}> ${p.name}</label>`).join('')}</div></div>
        <div class="admin-modal__actions">
          <button type="button" class="admin-btn admin-btn--ghost" data-close>Annuler</button>
          <button type="submit" class="admin-btn admin-btn--gold">${isEdit ? 'Enregistrer' : 'Créer'}</button>
        </div>
      </form>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelectorAll('[data-close]').forEach((el) => el.addEventListener('click', () => overlay.remove()));
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  document.getElementById('promoForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = {
      code: fd.get('code'), type: fd.get('type'), value: fd.get('value'),
      minOrderAmount: fd.get('minOrderAmount') || null,
      expiresAt: fd.get('expiresAt') || null,
      usageLimit: fd.get('usageLimit') || null,
      isActive: fd.get('isActive') === 'on',
      eligibleCollectionIds: Array.from(document.querySelectorAll('#promoCollections input:checked')).map((el) => el.value),
      eligiblePackIds: Array.from(document.querySelectorAll('#promoPacks input:checked')).map((el) => el.value),
      eligibleProductIds: Array.from(document.querySelectorAll('#promoProducts input:checked')).map((el) => el.value),
    };
    try {
      if (isEdit) await adminApi(`/promo-codes/${promo.id}`, { method: 'PUT', body: JSON.stringify(payload) });
      else await adminApi('/promo-codes', { method: 'POST', body: JSON.stringify(payload) });
      toast(isEdit ? 'Code mis à jour.' : 'Code créé.');
      overlay.remove(); await loadAll();
    } catch (err) { toast(err.message, 'error'); }
  });
}

(async () => {
  const admin = await initAdminPage('promo-codes.html');
  if (!admin) return;
  await loadAll();
})();
</script>
</body>
</html>
